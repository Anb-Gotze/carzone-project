databases:
  - name: carzone-db
    plan: free
    databaseName: carzone_db
    user: carzone

services:
  - type: web
    name: carzone-project
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn carzone.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carzone-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
